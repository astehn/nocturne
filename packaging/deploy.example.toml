# Template — copy to packaging/deploy.local.toml (gitignored) and fill in real
# values. Keep real hostnames/paths ONLY in deploy.local.toml; this example is
# committed to the public repo, so it must stay generic.
[github]
repo = "you/your-repo"

[website]
# Keyless SSH login as a user with passwordless sudo. May be a ~/.ssh/config
# alias that sets `User <name>`.
ssh_host = "deploy@your-vps.example.com"
remote_path = "/var/www/your-site"
owner = "www-data:www-data"       # applied to remote_path after upload
dir_mode = "755"
file_mode = "644"
# download_path = "/var/www/your-site/download/App.zip"   # if the site serves its own binary, the deploy refreshes it; MUST be inside remote_path
# Static assets to deploy. rsync runs WITHOUT --delete, so server-only files survive.
# "*.json" and "vendor/" exist for the planner page. The glob is NOT recursive,
# so a file in a subdirectory needs its directory listed explicitly -- and an
# asset missing from this allowlist does not fail anywhere: the page renders in
# local preview and 404s its engine in production.
include = ["*.html", "styles.css", "main.js", "lightbox.js", "contribute.js", "*.json", "vendor/", "get.php", "img/"]
# Internal files + server-state paths. REQUIRED (the script refuses to run
# without them): config*.php, db/, uploads/ protect server state; *.fits and
# *.fit stop astro data reaching the web root — sample masters are staged
# inside site/ and published by their own explicit step (samples_path).
exclude = [
  "img/_originals/", "PRODUCT.md", "DESIGN.md", "README.md",
  "_research_external_tools.md", "tests/",
  "config*.php", "db/", "uploads/", "*.fits", "*.fit", "admin/",
]

# The Linux build host, used only by `deploy.py --linux`. Omit the section and
# that flag refuses rather than guessing. `repo_path` is a checkout of THIS repo
# on that machine, with a .venv — packaging/build_linux.sh does the rest.
[linux]
ssh_host = "192.168.1.135"
repo_path = "/home/you/nocturne"
