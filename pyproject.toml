[project]
name = "nocturne"
version = "0.34.0"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "PySide6>=6.6",
    "astropy>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "colour-demosaicing>=0.2.5",
    "tifffile>=2024.1",
    "Pillow>=10.0",
    "astroalign>=2.5",
    "sep>=1.2",
    # CA certificates. NOT optional: a PyInstaller bundle inherits the BUILD
    # machine's compiled-in OpenSSL cert path (/opt/homebrew/etc/openssl@3/...),
    # which does not exist on a Mac without Homebrew. Every HTTPS call then dies
    # with CERTIFICATE_VERIFY_FAILED — silently, since both callers catch and
    # return None. See nocturne/core/certs.py.
    "certifi>=2024.2",
    # STScI drizzle (BSD-3, numpy only). Only reached when the user ticks the
    # box, but it must be a declared dependency and bundled, or the frozen app
    # raises ImportError the first time anyone tries it.
    "drizzle>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
train = ["torch>=2.2", "onnx>=1.16", "onnxruntime>=1.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# WHAT THE DISTRIBUTION IS. Without this, setuptools auto-discovery walks the
# repo root, finds four importable top-level trees — archive, training,
# nocturne, packaging — and REFUSES to build rather than guess:
#
#     error: Multiple top-level packages discovered in a flat-layout
#
# A long-lived venv never sees it, because the install predates the trees that
# now collide. A FRESH one fails immediately, which is how it surfaced: the
# first `pip install -e ".[dev]"` on the Linux laptop, 2026-09-18.
#
# Only `nocturne` ships. `training` and `archive` are deliberately outside the
# app (the shipped app must never depend on torch), and `packaging` holds build
# and deploy scripts that are run by path, not imported — tests/test_deploy.py
# puts that directory on sys.path itself.
[tool.setuptools.packages.find]
include = ["nocturne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# archive/ is the retired training-v1 system, kept for reference and never run.
norecursedirs = ["archive", "dist", "build", ".venv", ".venv-train"]
filterwarnings = [
    # colour-demosaicing imports the deprecated scipy.ndimage.filters namespace.
    "ignore:Please import .* from the .scipy.ndimage. namespace:DeprecationWarning",
    # colour-science notes matplotlib is absent; we do not use its plotting API.
    "ignore:.*Matplotlib.* related API features are not available",
]
