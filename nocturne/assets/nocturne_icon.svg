<?xml version="1.0" encoding="UTF-8"?>
<!-- Nocturne's app icon since 2026-10-06 (his pick, option A of three): the
     crescent of the website's favicon and the splash, cream (#EDE9E2) on the
     near-black of the splash, in the macOS icon grid (an 824 px body on a
     1024 canvas). The crescent alone because an icon lives small: stars and a
     red accent (option B, which he liked) vanished below Dock size. No SVG
     filter: Qt's renderer, which draws this for the .icns and the window icon,
     ignores filters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">Nocturne</title>
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2a2b31"/>
      <stop offset="100%" stop-color="#0c0c0f"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#g)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="none"
        stroke="url(#edge)" stroke-width="3"/>
  <path transform="translate(179.130 83.478) scale(24.348)"
        d="M13.27 6.14A10.5 10.5 0 1 0 25.14 19.21A9 9 0 0 1 13.27 6.14Z" fill="#EDE9E2"/>
</svg>
